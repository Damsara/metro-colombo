apiVersion: v1
kind: ServiceAccount
metadata:
  name: metro
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metro
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: metro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metro
    spec:
      serviceAccountName: metro
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metro
          image: registry.example.com/metro:0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8788
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=384
          envFrom:
            - secretRef:
                name: metro-secrets
                optional: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
