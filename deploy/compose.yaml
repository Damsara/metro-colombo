# Copy to ~/metro/compose.yaml on the VPS, next to a .env made from apps/node/.env.example.
# CI runs `IMAGE_TAG=<commit> docker compose pull && docker compose up -d --wait` here on every push to main.
services:
  metro:
    image: ghcr.io/damsara/metro-colombo:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    # Only the reverse proxy on this machine should reach the server; it adds HTTPS.
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      - metro-state:/data

volumes:
  metro-state:
